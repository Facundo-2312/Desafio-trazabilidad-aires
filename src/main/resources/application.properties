spring.application.name=Trazabilidad de Aires
spring.datasource.url=jdbc:h2:file:./data/trazabilidad;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.thymeleaf.cache=false
server.port=${PORT:8080}
app.public-base-url=
app.auth.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.auth.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
